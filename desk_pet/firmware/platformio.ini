; deskpet firmware. Build: pio run -e <env>; flash: pio run -e <env> -t upload
;
; The platform is the community "pioarduino" build of espressif32 (Arduino-ESP32
; 3.x); PlatformIO's own espressif32 platform still ships Arduino 2.x.

[platformio]
default_envs = m5stack-core

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps = lovyan03/LovyanGFX@1.2.35
build_flags =
    -DDESKPET_FW_VERSION=\"0.1.0\"
build_src_flags = -Wall

; M5Stack Basic / Gray (ESP32, no PSRAM): buttons A B C, speaker
[env:m5stack-core]
board = m5stack-core-esp32
build_flags = ${env.build_flags} -DLGFX_M5STACK

; M5Stack Core2 (PSRAM): touch strip as A B C
[env:m5stack-core2]
board = m5stack-core2
; the board definition already selects LovyanGFX's Core2 preset

; ESP32-2432S028R "Cheap Yellow Display" (ILI9341 or ST7789 panel): touch
[env:cyd]
board = esp32dev
build_flags = ${env.build_flags} -DLGFX_ESP32_2432S028
